<svg viewBox="0 0 1400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Purple background section -->
  <rect width="300" height="300" fill="#4a1f3a"/>
  
  <!-- Orange stylized "1" -->
  <path d="M 80 80 L 140 80 L 140 200 Q 140 220 120 220 L 100 220 Q 80 220 80 200 L 80 100" 
        fill="none" stroke="#ff8c00" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="70" r="25" fill="#ff8c00"/>
  
  <!-- "root" text (outlined) -->
  <text x="380" y="180" font-family="Arial, sans-serif" font-size="140" font-weight="300" 
        fill="none" stroke="#1a1a1a" stroke-width="3" letter-spacing="8">root</text>
  
  <!-- "&" in orange -->
  <text x="1050" y="180" font-family="Arial, sans-serif" font-size="140" font-weight="300" 
        fill="#ff8c00" letter-spacing="8">&</text>
  
  <!-- "skin" in black -->
  <text x="1180" y="180" font-family="Arial, sans-serif" font-size="140" font-weight="400" 
        fill="#1a1a1a" letter-spacing="8">skin</text>
  
  <!-- Purple bar at bottom -->
  <rect y="240" width="1400" height="60" fill="#4a1f3a"/>
</svg>